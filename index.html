<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#003d1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Instant body metrics via AI analysis" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Hei-wei — AI Biometrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'ui-sans-serif', 'system-ui'],
          },
          colors: {
            brand: '#00A562',
            'brand-dark': '#007A45',
            'brand-light': '#00C972',
            surface: '#0a0a0a',
          }
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #fafafa;
      font-family: 'Space Grotesk', sans-serif;
      background-image:
        radial-gradient(ellipse at 0% 0%, rgba(0, 165, 98, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, rgba(0, 165, 98, 0.06) 0%, transparent 50%);
      min-height: 100vh;
    }

    .glass {
      background: rgba(26, 26, 26, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes scan {
      0% {
        top: -20%;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        top: 120%;
        opacity: 0;
      }
    }

    .animate-scan {
      animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.1",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
