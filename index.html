<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#003d1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Instant body metrics via AI analysis" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Hei-wei — AI Biometrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'ui-sans-serif', 'system-ui'],
          },
          colors: {
            brand: '#00A562',
            'brand-dark': '#007A45',
            'brand-light': '#00C972',
            surface: '#0a0a0a',
          }
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #fafafa;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      /* Medium weight for body text */
      background-image:
        radial-gradient(ellipse at 0% 0%, rgba(0, 165, 98, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, rgba(0, 165, 98, 0.06) 0%, transparent 50%);
      min-height: 100vh;
    }

    .glass {
      background: rgba(26, 26, 26, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes scan {
      0% {
        top: -20%;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        top: 120%;
        opacity: 0;
      }
    }

    .animate-scan {
      animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Parallax hover effect for cards */
    .hover-lift {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    .hover-lift:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 20px 40px -12px rgba(0, 165, 98, 0.15);
    }

    /* ─── Light Mode ─── */
    .light body,
    html.light body {
      background-color: #f8f8f8;
      color: #171717;
      background-image:
        radial-gradient(ellipse at 0% 0%, rgba(0, 165, 98, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 100%, rgba(0, 165, 98, 0.03) 0%, transparent 50%);
    }

    html.light .glass {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    html.light .bg-neutral-900 {
      background-color: #ffffff !important;
    }

    html.light .bg-neutral-800 {
      background-color: #f0f0f0 !important;
    }

    html.light .border-neutral-800 {
      border-color: #e5e5e5 !important;
    }

    html.light .border-neutral-700 {
      border-color: #d4d4d4 !important;
    }

    html.light .text-white {
      color: #171717 !important;
    }

    html.light .text-zinc-400 {
      color: #737373 !important;
    }

    html.light .text-zinc-500 {
      color: #737373 !important;
    }

    html.light .text-zinc-600 {
      color: #a3a3a3 !important;
    }

    html.light .text-zinc-700 {
      color: #d4d4d4 !important;
    }

    html.light .text-zinc-300 {
      color: #525252 !important;
    }

    html.light .hover\:bg-neutral-800:hover {
      background-color: #e5e5e5 !important;
    }

    html.light .hover\:bg-neutral-700:hover {
      background-color: #d4d4d4 !important;
    }

    html.light .hover\:text-white:hover {
      color: #171717 !important;
    }

    html.light .hover\:text-zinc-300:hover {
      color: #525252 !important;
    }

    html.light .bg-black {
      background-color: #e5e5e5 !important;
    }

    html.light .bg-black\/50 {
      background-color: rgba(255, 255, 255, 0.7) !important;
    }

    html.light .bg-black\/40 {
      background-color: rgba(255, 255, 255, 0.6) !important;
    }

    html.light .from-black\/90 {
      --tw-gradient-from: rgba(248, 248, 248, 0.95) !important;
    }

    html.light .via-black\/60 {
      --tw-gradient-stops: var(--tw-gradient-from), rgba(248, 248, 248, 0.7), var(--tw-gradient-to) !important;
    }

    html.light .border-white\/10 {
      border-color: rgba(0, 0, 0, 0.08) !important;
    }

    html.light .bg-white\/10 {
      background-color: rgba(0, 0, 0, 0.06) !important;
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
